<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS Store</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* বেসিক রিসেট ও গেমার/টেক থিম স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0f0f1a;
            color: #ffffff;
            padding-bottom: 40px;
        }

        header {
            background: #181824;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d2ff;
        }

        header h1 {
            color: #00d2ff;
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ffbf00;
            border-left: 4px solid #ffbf00;
            padding-left: 10px;
        }

        /* Latest Updates (App Grid) স্টাইল */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .app-card {
            background: #1e1e2e;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .app-card:hover {
            transform: translateY(-3px);
        }

        .app-icon img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .app-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-stars {
            font-size: 11px;
            margin-bottom: 5px;
        }

        .mod-badge {
            background: #00d2ff;
            color: #0f0f1a;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Notices Section স্টাইল */
        .notice-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notice-card {
            background: #1e1e2e;
            border-left: 4px solid #00d2ff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .notice-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .notice-content {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .notice-date {
            font-size: 12px;
            color: #888888;
            text-align: right;
            display: block;
        }

        .loading-text {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>JRS Store</h1>
    </header>

    <div class="container">
        <!-- Latest Updates Section -->
        <div class="section-title">Latest Updates</div>
        <div class="app-grid">
            <div class="loading-text">অ্যাপস লোড হচ্ছে...</div>
        </div>

        <!-- Notices & Updates Section -->
        <div class="section-title">Notices & Updates</div>
        <div class="notice-container" id="notice-board">
            <div class="loading-text">নোটিশ লোড হচ্ছে...</div>
        </div>
    </div>

    <!-- Firebase SDK ও রিয়েলটাইম ডেটা ফেচিং লজিক -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";

        // আপনার সঠিক ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyCTV_PGdsnI2Tcbou3IJUU_r8ylwev9fU0",
            authDomain: "jrs-store.firebaseapp.com",
            databaseURL: "https://jrs-store-default-rtdb.firebaseio.com", // আপনার রিয়েলটাইম ডেটাবেস ইউআরএল ঠিক করা হয়েছে
            projectId: "jrs-store",
            storageBucket: "jrs-store.firebasestorage.app",
            messagingSenderId: "253830850008",
            appId: "1:253830850008:web:044aecd4131e90fd22fead",
            measurementId: "G-0905YJJG19"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ ও অ্যানালিটিক্স
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // ১. Latest Updates ডেটা লোড করা
        const updatesRef = ref(db, 'latest_updates');
        onValue(updatesRef, (snapshot) => {
            const data = snapshot.val();
            const appGrid = document.querySelector('.app-grid');
            appGrid.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    const cardHTML = `
                        <a href="details.php?id=${key}" class="app-card">
                            <div class="app-icon">
                                <img src="${item.image_url}" alt="${item.title}" loading="lazy">
                            </div>
                            <div class="app-title">${item.title}</div>
                            <div class="card-stars">
                                <i class="fas fa-star" style="color:#ffbf00;"></i>
                                <i class="fas fa-star" style="color:#ffbf00;"></i>
                                <i class="fas fa-star" style="color:#ffbf00;"></i>
                                <i class="fas fa-star" style="color:#ffbf00;"></i>
                                <i class="${item.rating >= 4.5 ? 'fas fa-star-half-alt' : 'far fa-star'}" style="color:${item.rating >= 4.5 ? '#ffbf00' : '#ccc'};"></i>
                            </div>
                            <div class="mod-badge">${item.version}</div>
                        </a>
                    `;
                    appGrid.insertAdjacentHTML('beforeend', cardHTML);
                });
            } else {
                appGrid.innerHTML = '<div class="loading-text">কোনো অ্যাপ পাওয়া যায়নি।</div>';
            }
        });

        // ২. Notices ডেটা লোড করা
        const noticesRef = ref(db, 'notices');
        onValue(noticesRef, (snapshot) => {
            const data = snapshot.val();
            const noticeBoard = document.getElementById('notice-board');
            noticeBoard.innerHTML = '';

            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const notice = data[key];
                    const noticeHTML = `
                        <div class="notice-card">
                            <div class="notice-title">${notice.title}</div>
                            <div class="notice-content">${notice.body}</div>
                            <span class="notice-date">${notice.date}</span>
                        </div>
                    `;
                    noticeBoard.insertAdjacentHTML('beforeend', noticeHTML);
                });
            } else {
                noticeBoard.innerHTML = '<div class="loading-text">এই মুহূর্তে কোনো নতুন নোটিশ নেই।</div>';
            }
        });
    </script>
</body>
</html>
